<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIBC Admin | Phase 3 Responses</title>
    
    <!-- html2pdf.js for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #121321;
            --accent: #C5A059;
            --bg: #F8FAFC;
            --border: #E2E8F0;
            --text: #334155;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        /* Navbar */
        .navbar {
            background-color: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
        }

        .navbar h1 { margin: 0; font-size: 22px; font-weight: 600; }

        /* Controls */
        .controls {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-count {
            background: white; padding: 10px 18px; border-radius: 6px;
            font-weight: bold; border: 1px solid var(--border);
            color: var(--primary); font-size: 15px;
        }
        .export-btn {
            background-color: var(--accent); color: white;
            border: none; padding: 12px 24px; border-radius: 6px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
            font-size: 14px; transition: 0.3s;
        }
        .export-btn:hover { background-color: #b38f4d; }

        /* Table */
        .table-container {
            margin: 0 30px 30px;
            background: white; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto; max-height: 75vh;
            border: 1px solid var(--border);
        }

        table { width: max-content; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        thead { background-color: #F1F5F9; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border); }
        th { text-align: left; padding: 14px 18px; color: #1e293b; font-weight: 700; border-right: 1px solid var(--border); }
        td { padding: 14px 18px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        tbody tr:hover { background-color: #f1f5f9; }

        .action-cell { display: flex; gap: 10px; }
        .pdf-btn {
            background: #10B981; color: white; border: none; padding: 8px 14px;
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .pdf-btn:hover { background: #059669; }
        
        .loading { text-align: center; padding: 40px; font-size: 16px; color: #64748B; width: 100%; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>MIBC Phase 3 Responses</h1>
    </div>

    <div class="controls">
        <div class="record-count" id="countDisplay">Loading...</div>
        <button class="export-btn" onclick="exportToCSV('dataTable', 'MIBC_Phase3_Responses.csv')">📥 Export to Excel</button>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Action</th>
                    <th>Date</th>
                    <th>Company</th>
                    <th>Person</th>
                    <th>Email</th>
                    <th>Price Commitment</th>
                    <th>Price Cap</th>
                    <th>FOB 100</th>
                    <th>FOB 300</th>
                    <th>FOB 1000</th>
                    <th>Payment Instruments</th>
                    <th>Advance %</th>
                    <th>Credit Insurance</th>
                    <th>Insurer Name</th>
                    <th>Budget Share</th>
                    <th>Freight Arranger</th>
                    <th>Forwarder Name</th>
                    <th>Allocation Bottles</th>
                    <th>Allocation SKUs</th>
                </tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="20" class="loading">Fetching data...</td></tr></tbody>
        </table>
    </div>

    <script>
        const API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? "http://localhost:5001" : "https://mibc-backend-4.onrender.com";

        let globalData = [];

        const safe = (val) => val ? (Array.isArray(val) ? val.join(", ") : val) : "-";
        const formatDate = (dateStr) => {
            if(!dateStr) return "-";
            const d = new Date(dateStr);
            return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        };

        async function loadData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/get-phase3`);
                const result = await res.json();
                const tbody = document.getElementById("tableBody");
                
                if (result.success) {
                    globalData = result.data;
                    document.getElementById("countDisplay").innerText = `Total Responses: ${result.count}`;
                    if(result.data.length === 0) return tbody.innerHTML = "<tr><td colspan='20' style='text-align:center;'>No records found</td></tr>";
                    
                    let html = "";
                    result.data.forEach((item, i) => {
                        html += `<tr>
                            <td class="action-cell"><button class="pdf-btn" onclick="generatePDF(${i})">Generate PDF</button></td>
                            <td>${formatDate(item.createdAt)}</td>
                            <td style="font-weight:bold; color: #121321;">${safe(item.company)}</td>
                            <td>${safe(item.person)}</td>
                            <td>${safe(item.email)}</td>
                            <td>${safe(item.priceCommitment)}</td>
                            <td>${safe(item.priceCap)}</td>
                            <td>$${safe(item.fob100)}</td>
                            <td>$${safe(item.fob300)}</td>
                            <td>$${safe(item.fob1000)}</td>
                            <td>${safe(item.paymentInstruments)}</td>
                            <td>${safe(item.advancePercent)}%</td>
                            <td>${safe(item.creditInsurance)}</td>
                            <td>${safe(item.insuranceName)}</td>
                            <td>${safe(item.budgetShare)}</td>
                            <td>${safe(item.freightArranger)}</td>
                            <td>${safe(item.forwarderName)}</td>
                            <td>${safe(item.allocationBottles)}</td>
                            <td>${safe(item.allocationSKUs)}</td>
                        </tr>`;
                    });
                    tbody.innerHTML = html;
                }
            } catch (err) { console.error(err); }
        }

        function generatePDF(index) {
            const item = globalData[index];
            const cleanComp = (item.company || "Company").replace(/[^a-zA-Z0-9]/g, "");
            const cleanPer = (item.person || "Person").replace(/[^a-zA-Z0-9]/g, "");
            const filename = `Phase3_${cleanComp}_${cleanPer}.pdf`;
            
            const qnaPairs = [
                { q: "Company Name", a: safe(item.company) },
                { q: "Contact Person", a: safe(item.person) },
                { q: "Email", a: safe(item.email) },
                { q: "Price Commitment", a: safe(item.priceCommitment) },
                { q: "Price Cap", a: safe(item.priceCap) },
                { q: "FOB 100 / 300 / 1000", a: `$${safe(item.fob100)} / $${safe(item.fob300)} / $${safe(item.fob1000)}` },
                { q: "Payment Instruments", a: safe(item.paymentInstruments) },
                { q: "Advance Percent", a: safe(item.advancePercent) + "%" },
                { q: "Credit Insurance", a: safe(item.creditInsurance) },
                { q: "Insurer Name", a: safe(item.insuranceName) },
                { q: "Budget Share", a: safe(item.budgetShare) },
                { q: "Freight Arranger", a: safe(item.freightArranger) },
                { q: "Forwarder Name", a: safe(item.forwarderName) },
                { q: "Allocation (Bottles & SKUs)", a: `${safe(item.allocationBottles)} Bottles - ${safe(item.allocationSKUs)}` }
            ];

            let contentHTML = `
                <div style="padding: 40px; font-family: 'Helvetica Neue', Helvetica, sans-serif;">
                    <div style="text-align: center; border-bottom: 4px solid #C5A059; padding-bottom: 20px; margin-bottom: 30px;">
                        <h1 style="color: #121321; font-size: 28px; margin: 0; letter-spacing: 2px;">MIBC <span style="color: #C5A059;">INDIA</span></h1>
                        <h2 style="font-size: 16px; margin: 10px 0 0 0; color: #64748b;">Phase 3 Questionnaire Submission</h2>
                        <div style="margin-top: 10px; font-size: 12px; color: #94a3b8;">Submitted: ${formatDate(item.createdAt)}</div>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                        <tbody>
            `;
            qnaPairs.forEach(row => {
                contentHTML += `
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid #e2e8f0; width: 35%; background-color: #f8fafc; font-weight: bold; color: #475569;">${row.q}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #e2e8f0; color: #0f172a;">${row.a}</td>
                    </tr>
                `;
            });
            contentHTML += `</tbody></table></div>`;

            const element = document.createElement('div');
            element.innerHTML = contentHTML;
            html2pdf().set({
                margin: 10, filename: filename, image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();
        }

        function exportToCSV(tableId, filename) {
            const table = document.getElementById(tableId);
            let csv = [];
            for (let i = 0; i < table.rows.length; i++) {
                let row = [], cols = table.rows[i].querySelectorAll("td, th");
                // Skip the "Action" column (index 0)
                for (let j = 1; j < cols.length; j++) {
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").replace(/"/g, '""');
                    row.push('"' + data + '"');
                }
                if(row.length > 0) csv.push(row.join(","));
            }
            const blob = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = loadData;
    </script>
</body>
</html>
