<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIBC | Cohort Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mibc-dark: #121321;
            --mibc-gold: #C5A059;
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --border: #e0e0e0;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .login-container {
            background: var(--card-bg);
            max-width: 450px; /* Thoda chota rakha hai login ke liye */
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            padding: 50px 40px;
            border-top: 4px solid var(--mibc-gold);
        }

        .header-text { text-align: center; margin-bottom: 35px; }
        .header-text h1 { margin: 0; font-size: 26px; color: var(--mibc-dark); font-weight: 700; }
        .header-text p { margin: 8px 0 0 0; color: #666; font-size: 14px; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 20px; position: relative; }

        label { font-size: 13px; font-weight: 500; color: #444; margin-bottom: 8px; }

        input {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--mibc-gold);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1);
        }

        .forgot-pass {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 12px;
            color: var(--mibc-gold);
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot-pass:hover { text-decoration: underline; }

        .btn-submit {
            background: var(--mibc-dark);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--mibc-gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: var(--mibc-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover { text-decoration: underline; }
        .error-txt { color: #dc2626; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }

        @media (max-width: 600px) {
            .login-container { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-text">
            <h1>Welcome Back</h1>
            <p>Login to access the Tequila Accelerator learning portal.</p>
        </div>

        <div class="error-txt" id="loginError">Invalid email or password.</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <a href="#" class="forgot-pass">Forgot?</a>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Login to Vault</button>
            
            <div class="register-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </form>
    </div>

  <script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorTxt = document.getElementById('loginError');

    errorTxt.style.display = 'none';
    btn.innerText = "Authenticating... ⏳";
    btn.disabled = true;

    try {
        const API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? "http://localhost:5001" : "https://mibc-backend-4.onrender.com";

        const response = await fetch(`${API_BASE_URL}/api/cohort-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
            // Save token and user details in browser
            localStorage.setItem("mibc_token", result.token);
            localStorage.setItem("mibc_user", result.user.fullName);
            
            // Redirect to restricted Cohort Dashboard
            window.location.href = "cohort-dashboard.html";
        } else {
            errorTxt.innerText = result.message || "Invalid credentials.";
            errorTxt.style.display = 'block';
            btn.innerText = "Login to Vault";
            btn.disabled = false;
        }
    } catch (error) {
        errorTxt.innerText = "Network Error. Please try again.";
        errorTxt.style.display = 'block';
        btn.innerText = "Login to Vault";
        btn.disabled = false;
    }
});
</script>
</body>
</html>
