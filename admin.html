<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIBC | Executive Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #F4EBD0;
            --dark-gold: #d4af37;
            --bg-white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            color: #2c2c2c;
        }

        .premium-header {
            background: var(--bg-white);
            border-bottom: 4px solid var(--gold);
            padding: 30px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        .premium-header h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-gold);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .stat-box {
            background: white;
            border: 1px solid var(--gold-light);
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-box:hover {
            border-color: var(--gold);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold);
            display: block;
        }

        .membership-table-card {
            background: white;
            border: 1px solid #eee;
            padding: 40px;
            margin-top: -50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }

        .table thead th {
            color: var(--dark-gold);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--gold-light);
            padding-bottom: 15px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 15px 10px;
            vertical-align: middle;
            border-bottom: 1px solid #f9f9f9;
            font-size: 14px;
        }

        .description-cell {
            max-width: 250px;
            font-size: 12px;
            color: #666;
            line-height: 1.4;
            font-style: italic;
            white-space: normal;
            word-wrap: break-word;
        }

        .badge-gold {
            background-color: var(--gold-light);
            color: var(--dark-gold);
            border: 1px solid var(--gold);
            font-weight: 600;
            padding: 4px 10px;
            font-size: 11px;
        }

        .btn-gold-action {
            color: var(--gold);
            border: 1px solid var(--gold);
            background: transparent;
            transition: 0.3s;
            font-size: 12px;
            padding: 5px 12px;
        }

        .btn-gold-action:hover {
            background: var(--gold);
            color: white;
        }

        .search-container input {
            border: 1px solid var(--gold-light);
            padding: 10px 20px;
            width: 300px;
        }

        .search-container input:focus {
            border-color: var(--gold);
            box-shadow: none;
            outline: none;
        }
    </style>
</head>

<body>

    <header class="premium-header text-center mb-5">
        <div class="container">
            <h2>MÉXICO–INDIA BUSINESS COUNCIL</h2>
            <p class="text-muted small text-uppercase" style="letter-spacing: 3px;">Executive Membership Dashboard</p>
        </div>
    </header>

    <div class="container pb-5">
        <div class="row g-0 mb-5">
            <div class="col-md-4">
                <div class="stat-box">
                    <span class="stat-number" id="total-count">0</span>
                    <span class="text-muted small text-uppercase">Total Applications</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box" style="border-left: none; border-right: none;">
                    <span class="stat-number"><i class="fas fa-gem"></i></span>
                    <span class="text-muted small text-uppercase">MIBC Verified</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box">
                    <span class="stat-number">
                        <i class="fas fa-sync-alt" id="refresh-icon" style="cursor:pointer" onclick="fetchData()"></i>
                    </span>
                    <span class="text-muted small text-uppercase">Live Sync</span>
                </div>
            </div>
        </div>
        
        <div class="container mb-4 text-center">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-warning active" id="btn-members" onclick="switchTab('members')">Memberships</button>
                <button type="button" class="btn btn-outline-warning" id="btn-queries" onclick="switchTab('queries')">General Queries</button>
            </div>
        </div>

        <div class="membership-table-card">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <h4 class="fw-bold mb-0" style="color: var(--dark-gold);">Current Applications</h4>
                <div class="d-flex gap-2 align-items-center">
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Search name, company or email..." onkeyup="filterTable()">
                    </div>
                    <button class="btn btn-success" onclick="exportToExcel()">
                        <i class="fas fa-file-excel me-1"></i> Export Excel
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle" id="exportTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Tier</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Company</th>
                            <th>Objectives</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                        <tr>
                            <td colspan="8" class="text-center py-5">
                                <div class="spinner-border text-warning" role="status"></div>
                                <p class="mt-2 text-muted">Loading MIBC Data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
    const API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
        ? "http://localhost:5001" 
        : "https://mibc-backend-4.onrender.com";

    let currentTab = 'members'; // Default tab state

    // Tab Switch Function
    function switchTab(tab) {
        currentTab = tab;
        
        // Update Buttons
        const btnMembers = document.getElementById('btn-members');
        const btnQueries = document.getElementById('btn-queries');
        if(btnMembers) btnMembers.classList.toggle('active', tab === 'members');
        if(btnQueries) btnQueries.classList.toggle('active', tab === 'queries');
        
        // Update Table Headers dynamically with separated columns
        const tableHeader = document.querySelector('thead tr');
        if(tableHeader) {
            if(tab === 'queries') {
                tableHeader.innerHTML = `
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Message</th>
                    <th>Action</th>`;
            } else {
                tableHeader.innerHTML = `
                    <th>Date</th>
                    <th>Tier</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th>Objectives</th>
                    <th>Action</th>`;
            }
        }
        fetchData(); 
    }

    // Main Data Fetch Function
    async function fetchData() {
        const refreshIcon = document.getElementById("refresh-icon");
        const tableBody = document.getElementById("data-table");
        const totalCount = document.getElementById("total-count");

        // Adjusted colspan dynamically for proper center alignment of spinner
        const colCount = currentTab === 'members' ? 8 : 7; 

        if(refreshIcon) refreshIcon.classList.add("fa-spin");
        
        tableBody.innerHTML = `
            <tr>
                <td colspan="${colCount}" class="text-center py-5">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2 text-muted">Syncing Live ${currentTab === 'members' ? 'Memberships' : 'Queries'}...</p>
                </td>
            </tr>`;

        try {
            const endpoint = currentTab === 'members' ? '/api/admin/memberships' : '/api/admin/queries';
            const response = await axios.get(`${API_BASE_URL}${endpoint}`);
            const list = response.data.data;
            
            totalCount.innerText = list.length;
            tableBody.innerHTML = ""; 

            if (!list || list.length === 0) {
                tableBody.innerHTML = `<tr><td colspan='${colCount}' class='text-center py-5 text-muted'>No ${currentTab} found.</td></tr>`;
                return;
            }

            let rowsHtml = ""; 
            list.forEach(item => {
                const date = new Date(item.createdAt).toLocaleDateString('en-GB', { 
                    day: '2-digit', month: 'short', year: 'numeric' 
                });
                
                if (currentTab === 'members') {
                    rowsHtml += `
                    <tr>
                        <td><span class="text-muted small">${date}</span></td>
                        <td><span class="badge badge-gold">${item.selectedPlan || 'GENERAL'}</span></td>
                        <td><div class="fw-bold text-dark">${item.name || 'N/A'}</div></td>
                        <td><div class="text-muted small">${item.email || 'N/A'}</div></td>
                        <td><div class="text-muted small">${item.phone || 'N/A'}</div></td>
                        <td><span class="fw-semibold text-uppercase" style="font-size: 13px;">${item.company || 'N/A'}</span></td>
                        <td><div class="description-cell">${item.message || 'N/A'}</div></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a href="mailto:${item.email}" class="btn btn-sm btn-gold-action"><i class="fas fa-reply"></i></a>
                                <a href="tel:${item.phone}" class="btn btn-sm btn-gold-action"><i class="fas fa-phone"></i></a>
                            </div>
                        </td>
                    </tr>`;
                } else {
                    rowsHtml += `
                    <tr>
                        <td><span class="text-muted small">${date}</span></td>
                        <td><span class="badge bg-light text-dark border">${item.subject || 'Inquiry'}</span></td>
                        <td><div class="fw-bold text-dark">${item.name || 'N/A'}</div></td>
                        <td><div class="text-muted small">${item.email || 'N/A'}</div></td>
                        <td><div class="text-muted small">${item.phone || 'N/A'}</div></td>
                        <td><div class="description-cell" style="max-width:250px;">${item.message || 'N/A'}</div></td>
                        <td>
                            <a href="mailto:${item.email}" class="btn btn-sm btn-gold-action"><i class="fas fa-reply"></i></a>
                        </td>
                    </tr>`;
                }
            });

            tableBody.innerHTML = rowsHtml;

        } catch (error) {
            console.error("Fetch Error:", error);
            tableBody.innerHTML = `<tr><td colspan="${colCount}" class="text-center text-danger py-5">Failed to load data. Server might be sleeping.</td></tr>`;
        } finally {
            if(refreshIcon) refreshIcon.classList.remove("fa-spin");
        }
    }

    // Search Functionality
    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("data-table");
        const tr = table.getElementsByTagName("tr");

        for (let i = 0; i < tr.length; i++) {
            const textContent = tr[i].textContent || tr[i].innerText;
            tr[i].style.display = textContent.toUpperCase().indexOf(filter) > -1 ? "" : "none";
        }
    }

    // Export to Excel Functionality
    function exportToExcel() {
        // Table element select karein
        const table = document.getElementById("exportTable");
        
        // HTML table se direct workbook generate karein
        const wb = XLSX.utils.table_to_book(table, { sheet: "Data" });
        
        // File ka naam tab aur current date ke hisaab se
        const fileName = `MIBC_${currentTab === 'members' ? 'Memberships' : 'Queries'}_${new Date().toISOString().split('T')[0]}.xlsx`;
        
        // Excel download
        XLSX.writeFile(wb, fileName);
    }

    // Initial Load
    window.onload = fetchData;
    </script>
</body>

</html>
